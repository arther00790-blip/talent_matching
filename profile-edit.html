<!DOCTYPE html>
<!-- 骨格は docs/templates/page-base.html と同じ。ページ固有の内容は <main> 内と pages/*.css / pages/*.js に書く -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>プロフィール編集 | StageLink</title>
  <meta name="description" content="自己紹介文・スキル・自己紹介動画を編集します。">
  <!-- OGP：SNS で共有されたときのタイトル・説明。og:image / og:url は公開 URL が決まってから絶対 URL で足す -->
  <meta property="og:title" content="プロフィール編集 | StageLink">
  <meta property="og:description" content="自己紹介文・スキル・自己紹介動画を編集します。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StageLink">
  <meta property="og:locale" content="ja_JP">

  <!-- フォント：接続を先に確立して表示までの待ち時間を減らす。display=swap で読み込み中も文字を出す -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">

  <!-- 共通ベース（#01） -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/utilities.css">
  <!-- 共通UIコンポーネント -->
  <link rel="stylesheet" href="css/components.css">
  <!-- レイアウト：サイト共通＋ページの種類ごと -->
  <link rel="stylesheet" href="css/layouts/site.css">
  <link rel="stylesheet" href="css/layouts/form.css">
  <!-- ページ固有 -->
  <link rel="stylesheet" href="css/pages/profile-edit.css">
</head>
<body class="bg-background text-foreground">
  <a href="#main" class="skip-link">本文へスキップ</a>

  <!-- ヘッダーは js/common.js（components/header.js）が描画する -->
  <div id="site-header"></div>

  <main id="main">
    <div class="form-layout profile-edit">
      <div class="form-layout__header">
        <h1>プロフィール編集</h1>
        <p class="form-layout__lead">自己紹介文・スキル・自己紹介動画を編集できます。内容はこのブラウザの中にだけ保存されます（デモ）。</p>
      </div>

      <!-- タレント以外のロールでは案内文だけを出す（profile-edit.js が切り替える） -->
      <p class="profile-edit__gate" data-profile-gate role="status" hidden></p>

      <div class="profile-edit__content" data-profile-content hidden>
        <section class="profile-edit__section" aria-labelledby="profile-heading">
          <h2 class="profile-edit__heading" id="profile-heading">プロフィール</h2>
          <form class="form-layout__form" data-profile-form novalidate>
            <div class="form-field">
              <label class="form-field__label" for="profile-bio">自己紹介文<span class="form-field__required">必須</span></label>
              <textarea class="form-field__input" id="profile-bio" name="bio" rows="5" required data-field="bio" aria-describedby="profile-bio-count profile-bio-error"></textarea>
              <p class="form-field__help" id="profile-bio-count" data-bio-count></p>
              <p class="form-field__error" id="profile-bio-error" data-field-error="bio" hidden></p>
            </div>

            <fieldset class="profile-edit__fieldset" data-field="skills" aria-describedby="profile-skills-error">
              <legend class="form-field__label">スキル（複数選択できます）</legend>
              <div class="cluster profile-edit__skills" data-skill-options></div>
              <p class="form-field__error" id="profile-skills-error" data-field-error="skills" hidden></p>
            </fieldset>

            <div class="form-layout__actions">
              <button type="submit" class="button button--primary">プロフィールを保存する</button>
            </div>
          </form>
        </section>

        <section class="profile-edit__section video-uploader" aria-labelledby="video-heading" data-video-uploader>
          <h2 class="profile-edit__heading" id="video-heading">自己紹介動画</h2>
          <p class="form-field__help" id="video-rules">MP4・WebM・MOV／50MBまで／60秒以内。登録できるのは1人1本までです（登録済みなら差し替えになります）。</p>
          <p class="video-uploader__notice" data-video-unavailable role="status" hidden></p>

          <!-- 登録済みの動画と、差し替え・削除 -->
          <div class="video-uploader__current" data-video-current hidden>
            <div class="video-uploader__player" data-video-current-player></div>
            <div class="cluster video-uploader__current-actions">
              <button type="button" class="button button--outline" data-video-replace>差し替え</button>
              <button type="button" class="button button--danger" data-video-delete>削除</button>
            </div>
          </div>

          <form class="form-layout__form video-uploader__form" data-video-form novalidate>
            <div class="video-uploader__picker">
              <!-- input は見た目だけ隠し、Tab で選んで Enter / Space でファイル選択を開けるようにする -->
              <input type="file" class="visually-hidden video-uploader__input" id="video-file" name="video" accept="video/mp4,video/webm,video/quicktime" aria-describedby="video-rules video-error" data-video-input>
              <label class="video-uploader__drop" for="video-file" data-video-drop>
                <span class="video-uploader__drop-icon" aria-hidden="true">▶</span>
                <span class="video-uploader__drop-text">ここに動画をドラッグ＆ドロップ</span>
                <span class="video-uploader__drop-or">または</span>
                <span class="button button--outline video-uploader__choose">動画を選ぶ</span>
              </label>
              <p class="video-uploader__file" data-video-file-name hidden></p>
              <p class="form-field__error video-uploader__error" id="video-error" data-video-error aria-live="polite"></p>
            </div>

            <div class="video-uploader__preview" data-video-preview hidden>
              <video class="video-uploader__video" controls playsinline preload="metadata" aria-label="選択した動画のプレビュー" data-video-preview-video></video>
            </div>

            <div class="form-field">
              <label class="form-field__label" for="video-caption">一言説明（任意）</label>
              <input type="text" class="form-field__input" id="video-caption" name="caption" placeholder="例：30秒で自己紹介します！" data-video-caption aria-describedby="video-caption-count video-caption-error">
              <p class="form-field__help" id="video-caption-count" data-video-caption-count></p>
              <p class="form-field__error" id="video-caption-error" data-video-caption-error hidden></p>
            </div>

            <div class="form-field">
              <label class="video-uploader__consent">
                <input type="checkbox" class="video-uploader__checkbox" name="agreed" required data-video-agreed aria-describedby="video-agreed-help video-agreed-error">
                <span>公開に同意する</span><span class="form-field__required">必須</span>
              </label>
              <p class="form-field__help" id="video-agreed-help">登録した動画は、タレント詳細ページで企業が視聴できるようになります。</p>
              <p class="form-field__error" id="video-agreed-error" data-video-agreed-error hidden></p>
            </div>

            <div class="form-layout__actions">
              <button type="button" class="button button--ghost" data-video-cancel hidden>差し替えをやめる</button>
              <button type="submit" class="button button--primary" aria-describedby="video-submit-hint" data-video-submit disabled>登録する</button>
            </div>
            <p class="form-field__help video-uploader__hint" id="video-submit-hint" data-video-submit-hint></p>
          </form>
        </section>
      </div>
    </div>
  </main>

  <!-- フッターは js/common.js（components/footer.js）が描画する -->
  <div id="site-footer"></div>

  <!-- 共通JS → ページJS の順。ページJSが共通部品の描画結果を前提にできるようにするため -->
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/pages/profile-edit.js"></script>
</body>
</html>
