<!DOCTYPE html>
<!-- 骨格は docs/templates/page-base.html と同じ。ページ固有の内容は <main> 内と pages/*.css / pages/*.js に書く -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>マイページ | StageLink</title>
  <meta name="description" content="応募状況・スカウト・お気に入りを確認できます。">
  <!-- OGP：SNS で共有されたときのタイトル・説明。og:image / og:url は公開 URL が決まってから絶対 URL で足す -->
  <meta property="og:title" content="マイページ | StageLink">
  <meta property="og:description" content="応募状況・スカウト・お気に入りを確認できます。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="StageLink">
  <meta property="og:locale" content="ja_JP">

  <!-- フォント：接続を先に確立して表示までの待ち時間を減らす。display=swap で読み込み中も文字を出す -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">

  <!-- 共通ベース（#01） -->
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/utilities.css">
  <!-- 共通UIコンポーネント -->
  <link rel="stylesheet" href="css/components.css">
  <!-- レイアウト：サイト共通＋ページの種類ごと -->
  <link rel="stylesheet" href="css/layouts/site.css">
  <link rel="stylesheet" href="css/layouts/dashboard.css">
  <!-- ページ固有 -->
  <link rel="stylesheet" href="css/pages/mypage.css">
</head>
<body class="bg-background text-foreground">
  <a href="#main" class="skip-link">本文へスキップ</a>

  <!-- ヘッダーは js/common.js（components/header.js）が描画する -->
  <div id="site-header"></div>

  <main id="main">
    <div class="container dashboard-layout mypage">
      <div class="dashboard-layout__header">
        <h1>マイページ</h1>
        <!-- デモデータのリセット（要件 4.5）。押すと確認ダイアログを開く -->
        <button type="button" class="button button--outline button--sm" data-reset-demo>デモデータをリセット</button>
      </div>

      <!-- ゲストのときは案内文だけを出す（mypage.js が切り替える） -->
      <p class="mypage__gate" data-mypage-gate role="status" hidden></p>

      <!-- ロールごとの中身は mypage.js（components/mypage-talent.js / mypage-company.js）が描画する -->
      <div class="dashboard-layout__panel mypage__content" data-mypage-content aria-busy="true"></div>
    </div>
  </main>

  <!-- フッターは js/common.js（components/footer.js）が描画する -->
  <div id="site-footer"></div>

  <!-- 共通JS → ページJS の順。ページJSが共通部品の描画結果を前提にできるようにするため -->
  <script type="module" src="js/common.js"></script>
  <script type="module" src="js/pages/mypage.js"></script>
</body>
</html>
