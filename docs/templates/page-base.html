<!DOCTYPE html>
<!--
  ==========================================================================
  StageLink 共通HTML骨格（RootLayout 相当）
  --------------------------------------------------------------------------
  このブロックは編集しない。ページ固有の内容は <main> 内と pages/*.css / pages/*.js に書く。

  理由：
    - 全ページで lang・フォント・トークンCSSの読み込み順・ヘッダー/フッターの差し込み位置を
      そろえておかないと、ページごとに見た目やアクセシビリティがずれていくため。
    - CSS は後に読んだものが優先されるので、reset → variables → base → utilities →
      components → layouts → pages の順を崩すと上書き関係が壊れるため。

  使い方（#03 で各ページを作るとき）：
    - このファイルをルート直下へコピーし、パス先頭の "../../" を取り除く
      （このテンプレート自体を Live Server で直接開いて確認できるよう、ここでは相対パスにしている）。
    - <title> と <meta name="description"> をページに合わせて書き換える。
    - 「（#02）」「（#03）」の行は、該当ファイルができたらコメントを外す
      （存在しないファイルを読み込むとコンソールに 404 エラーが出るため、今はコメントにしている）。
  ==========================================================================
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>ページ名 | StageLink</title>
  <meta name="description" content="StageLink（ポートフォリオ用デモ）：タレントと広告・映像制作会社をつなぐマッチングサイト">

  <!-- フォント：接続を先に確立して表示までの待ち時間を減らす。display=swap で読み込み中も文字を出す -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">

  <!-- 共通ベース（#01） -->
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/utilities.css">
  <!-- （#02）共通UIコンポーネント -->
  <!-- <link rel="stylesheet" href="../../css/components.css"> -->
  <!-- （#03）レイアウトパターン：ページに合うものを1つ -->
  <!-- <link rel="stylesheet" href="../../css/layouts/xxx.css"> -->
  <!-- ページ固有 -->
  <!-- <link rel="stylesheet" href="../../css/pages/xxx.css"> -->
</head>
<body class="bg-background text-foreground">
  <a href="#main" class="skip-link">本文へスキップ</a>

  <!-- ヘッダーは js/components/header.js が描画する（#03） -->
  <div id="site-header"></div>

  <main id="main">
    <!-- ページ固有の内容はここに書く -->
  </main>

  <!-- フッターは js/components/footer.js が描画する（#03） -->
  <div id="site-footer"></div>

  <!-- 共通JS → ページJS の順。ページJSが共通部品の描画結果を前提にできるようにするため -->
  <!-- <script type="module" src="../../js/components/header.js"></script> -->
  <!-- <script type="module" src="../../js/components/footer.js"></script> -->
  <!-- <script type="module" src="../../js/pages/xxx.js"></script> -->
</body>
</html>
